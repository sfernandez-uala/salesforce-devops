<template>
    <div class={containerClass}>
        <lightning-empty-state
            title={title}
            illustration-name={illustrationName}
            size={size}
            alternative-text={alternativeText}
        >
            <!-- Each region is handed to the platform component as one element
                 carrying the slot attribute, with our own slot nested inside it.
                 Putting the slot attribute on a <slot> instead re-projects one
                 slot into another, and consumer content never arrives. -->
            <div slot="description">
                <template lwc:if={description}>
                    <p>{description}</p>
                </template>
                <template lwc:else>
                    <slot name="description"></slot>
                </template>
            </div>

            <div slot="cta">
                <template lwc:if={retryLabel}>
                    <lightning-button
                        variant="brand"
                        label={retryLabel}
                        onclick={handleRetryClick}
                    ></lightning-button>
                </template>
                <slot name="cta"></slot>
            </div>
        </lightning-empty-state>
    </div>
</template>
