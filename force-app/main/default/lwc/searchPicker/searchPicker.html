<template>
    <div class="slds-form-element" onfocusout={handleFocusOut}>
        <template lwc:if={showLabel}>
            <label class="slds-form-element__label">
                <template lwc:if={required}>
                    <abbr class="slds-required" title="required">*</abbr>
                </template>
                {label}
            </label>
        </template>
        <div class="slds-form-element__control">
            <div class={comboboxClass}>
                <button
                    type="button"
                    class={triggerClass}
                    aria-haspopup="listbox"
                    aria-expanded={open}
                    aria-label={label}
                    disabled={disabled}
                    data-id="picker-trigger"
                    onclick={handleToggle}
                >
                    <span class="slds-truncate">{displayLabel}</span>
                    <template lwc:if={isButtonVariant}>
                        <lightning-icon
                            icon-name="utility:down"
                            size="xx-small"
                            class="slds-m-left_xx-small"
                        ></lightning-icon>
                    </template>
                </button>

                <template lwc:if={open}>
                    <div class="slds-dropdown slds-dropdown_left slds-dropdown_fluid">
                        <div class="slds-p-around_x-small slds-border_bottom">
                            <lightning-input
                                type="search"
                                label={label}
                                variant="label-hidden"
                                placeholder={placeholder}
                                value={query}
                                data-id="picker-search"
                                onchange={handleQuery}
                            ></lightning-input>
                        </div>
                        <ul class="slds-dropdown__list slds-dropdown_length-10" role="listbox">
                            <template for:each={filteredOptions} for:item="option">
                                <li key={option.key} class="slds-dropdown__item" role="presentation">
                                    <button
                                        type="button"
                                        class="search-picker-option slds-p-vertical_x-small slds-p-horizontal_small"
                                        role="option"
                                        data-value={option.value}
                                        data-id="picker-option"
                                        onclick={handleSelect}
                                    >
                                        <span class="slds-truncate">{option.label}</span>
                                        <template lwc:if={option.detail}>
                                            <span class="slds-text-body_small slds-text-color_weak slds-truncate">
                                                {option.detail}
                                            </span>
                                        </template>
                                    </button>
                                </li>
                            </template>
                        </ul>
                        <template lwc:if={hasNoMatch}>
                            <p
                                class="slds-p-around_small slds-text-body_small slds-text-color_weak"
                                data-id="picker-empty"
                            >
                                {noMatchMessage}
                            </p>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
