<template>
    <div class="slds-p-horizontal_medium slds-p-bottom_small">
        <template lwc:if={hasError}>
            <c-empty-state
                data-id="error-state"
                title="Something went wrong"
                illustration-name="error:recoverable"
                alternative-text="Error illustration"
                description="Unable to load account details right now."
                retry-label="Retry"
                onretry={handleRetry}
            ></c-empty-state>
        </template>
        <template lwc:elseif={isSkeleton}>
            <div class="slds-form" role="presentation" data-id="skeleton-state" aria-hidden="true">
                <div class="v360-stencil-bar v360-stencil-bar_short"></div>
                <div class="v360-stencil-bar v360-stencil-bar_long"></div>
                <div class="v360-stencil-bar v360-stencil-bar_short"></div>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-form" role="list">
                <template lwc:if={hasIndustry}>
                    <div class="slds-form-element slds-form-element_readonly slds-form-element_stacked" role="listitem">
                        <span class="slds-form-element__label">Industry</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">{industry}</div>
                        </div>
                    </div>
                </template>
                <template lwc:if={hasAnnualRevenue}>
                    <div class="slds-form-element slds-form-element_readonly slds-form-element_stacked" role="listitem">
                        <span class="slds-form-element__label">Annual Revenue</span>
                        <div class="slds-form-element__control">
                            <div class="slds-form-element__static">
                                <lightning-formatted-number
                                    value={annualRevenue}
                                    format-style="currency"
                                ></lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <template lwc:if={hasNoVisibleFields}>
                <c-empty-state
                    data-id="no-fields-state"
                    title="No account details available"
                    illustration-name="access:request"
                    alternative-text="No access illustration"
                    description="No account details are available for this user."
                ></c-empty-state>
            </template>
        </template>
    </div>
</template>
