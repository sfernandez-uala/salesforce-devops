<template>
    <lightning-card title="Vista 360 Configuration" icon-name="standard:settings">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            variant="border-filled"
            alternative-text="Refresh"
            title="Refresh"
            data-id="refresh"
            onclick={handleRefresh}
        ></lightning-button-icon>

        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-around_xx-large" data-id="loading-state">
                    <lightning-spinner alternative-text="Loading configuration" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={isError}>
                <c-v360-empty-state
                    data-id="error-state"
                    title="Something went wrong"
                    illustration-name="error:recoverable"
                    alternative-text="Error illustration"
                    description="Unable to load the Vista 360 configuration right now."
                    retry-label="Retry"
                    onretry={handleRetry}
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isDenied}>
                <c-v360-empty-state
                    data-id="denied-state"
                    title="Access needed"
                    illustration-name="access:request"
                    alternative-text="No access illustration"
                    description="Managing Vista 360 cards requires the V360 Admin permission set."
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isEmpty}>
                <c-v360-empty-state
                    data-id="empty-state"
                    title="No configuration yet"
                    illustration-name="noresults:unknown"
                    alternative-text="No results illustration"
                    description="No Vista 360 tabs are configured in this org."
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isCatalogVisible}>
                <div class="slds-is-relative">
                <template lwc:if={refreshing}>
                    <lightning-spinner
                        alternative-text="Saving changes"
                        size="small"
                        data-id="refresh-spinner"
                    ></lightning-spinner>
                </template>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_2-of-12">
                        <lightning-vertical-navigation
                            selected-item={selectedTabId}
                            onselect={handleTabSelect}
                            data-id="tab-navigation"
                        >
                            <template for:each={navigationSections} for:item="section">
                                <lightning-vertical-navigation-section
                                    key={section.sObjectApiName}
                                    label={section.sObjectApiName}
                                >
                                    <template for:each={section.tabs} for:item="navTab">
                                        <lightning-vertical-navigation-item
                                            key={navTab.tabId}
                                            label={navTab.navLabel}
                                            name={navTab.tabId}
                                        ></lightning-vertical-navigation-item>
                                    </template>
                                </lightning-vertical-navigation-section>
                            </template>
                        </lightning-vertical-navigation>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12 slds-large-size_6-of-12" data-id="workspace">
                        <template lwc:if={workspace}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <div class="slds-grow">
                                    <h2 class="slds-text-heading_small" data-id="workspace-title">{workspace.title}</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">{workspace.subtitle}</p>
                                </div>
                                <span class="slds-m-right_x-small slds-text-body_small slds-text-color_weak">
                                    {workspace.cardCountLabel}
                                </span>
                                <span class={workspace.statusClass}>{workspace.statusLabel}</span>
                                <lightning-button
                                    variant="brand"
                                    label="New card"
                                    class="slds-m-left_x-small"
                                    data-id="new-card"
                                    onclick={handleNewCard}
                                ></lightning-button>
                            </div>

                            <template for:each={workspace.cards} for:item="card">
                                <div
                                    key={card.cardId}
                                    class={card.rowClass}
                                    data-id="card-row"
                                    data-card-id={card.cardId}
                                    role="button"
                                    tabindex="0"
                                    aria-pressed={card.isSelected}
                                    onclick={handleCardOpen}
                                    onkeydown={handleCardKeydown}
                                >
                                    <div class="slds-media__figure slds-media__figure_fixed-width slds-align_absolute-center">
                                        <lightning-icon icon-name={card.iconNameOrDefault} size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body slds-border_left slds-p-left_small">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="slds-text-heading_small slds-truncate slds-m-right_x-small">{card.label}</span>
                                            <span class={card.stateClass} data-id="card-state">{card.stateLabel}</span>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak slds-truncate">
                                            {card.developerName} · {card.binding}
                                        </p>
                                        <p class="slds-text-body_small slds-truncate" data-id="rule-summary">{card.ruleSummary}</p>
                                    </div>
                                    <div class="slds-media__figure slds-media__figure_reverse slds-align_absolute-center">
                                        <div class="slds-grid slds-grid_vertical">
                                            <lightning-button-icon
                                                icon-name="utility:arrowup"
                                                variant="border-filled"
                                                size="small"
                                                alternative-text="Move up"
                                                title="Move up"
                                                data-id="move-up"
                                                data-card-id={card.cardId}
                                                disabled={card.moveUpDisabled}
                                                onclick={handleMoveUp}
                                                class="slds-m-bottom_xx-small"
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:arrowdown"
                                                variant="border-filled"
                                                size="small"
                                                alternative-text="Move down"
                                                title="Move down"
                                                data-id="move-down"
                                                data-card-id={card.cardId}
                                                disabled={card.moveDownDisabled}
                                                onclick={handleMoveDown}
                                            ></lightning-button-icon>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12" data-id="detail-panel">
                        <template lwc:if={detail}>
                            <div class="slds-box slds-box_small slds-theme_shade">
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                    <lightning-icon
                                        icon-name={detail.iconNameOrDefault}
                                        size="small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    <h3 class="slds-text-heading_small slds-grow slds-truncate" data-id="detail-title">{detail.label}</h3>
                                    <span class={detail.stateClass}>{detail.stateLabel}</span>
                                </div>

                                <template lwc:if={detail.isDraft}>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info slds-m-bottom_small" role="status" data-id="draft-banner">
                                        <div class="slds-media__body slds-grid slds-grid_vertical-align-center">
                                            <p class="slds-grow slds-m-right_x-small">This card is a draft — end users can't see it yet.</p>
                                            <lightning-button
                                                variant="brand"
                                                label="Activate…"
                                                data-id="activate-open"
                                                onclick={handleOpenActivation}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:if={detail.isKilled}>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_small" role="status" data-id="kill-banner">
                                        <div class="slds-media__body">
                                            <p>The kill switch is on — this card is hidden everywhere and rules are not evaluated.</p>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-box slds-box_small slds-theme_default slds-m-bottom_small">
                                    <p class="slds-text-title_caps slds-m-bottom_x-small">Properties</p>
                                    <lightning-input
                                        label="Label"
                                        value={detail.label}
                                        data-id="prop-label"
                                    ></lightning-input>
                                    <lightning-combobox
                                        label="Component"
                                        value={detail.bindingValue}
                                        options={componentOptions}
                                        data-id="prop-component"
                                        field-level-help="LWC options come from the card registry; Flow bindings are validated as active screen flows on save."
                                    ></lightning-combobox>
                                    <lightning-input
                                        label="Tile button label"
                                        value={detail.buttonLabel}
                                        data-id="prop-button-label"
                                    ></lightning-input>
                                    <div class="slds-m-top_small slds-text-align_right">
                                        <lightning-button
                                            variant="brand"
                                            label="Save card"
                                            data-id="save-properties"
                                            onclick={handleSaveProperties}
                                        ></lightning-button>
                                    </div>
                                </div>

                                <div class="slds-box slds-box_small slds-theme_default">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                        <p class="slds-text-title_caps slds-grow">Visibility rules</p>
                                        <lightning-button
                                            label="Add rule"
                                            data-id="add-rule"
                                            onclick={handleAddRule}
                                        ></lightning-button>
                                    </div>
                                    <template lwc:if={detail.hasNoRules}>
                                        <p class="slds-text-body_small" data-id="no-rules-note">
                                            No rules yet. Without rules this card is visible to everyone who can see the page.
                                        </p>
                                    </template>
                                    <template for:each={detail.rules} for:item="rule">
                                        <div key={rule.ruleId} class="slds-box slds-box_x-small slds-m-bottom_x-small" data-id="rule">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                                <span class="slds-text-heading_small slds-grow slds-truncate">{rule.developerName}</span>
                                                <span class={rule.activeClass}>{rule.activeLabel}</span>
                                            </div>
                                            <div class="slds-form-element">
                                                <label class="slds-form-element__label" for={rule.formulaFieldId}>Visibility formula</label>
                                                <div class="slds-form-element__control">
                                                    <textarea
                                                        id={rule.formulaFieldId}
                                                        class="slds-textarea v360-admin-formula"
                                                        data-id={rule.formulaFieldId}
                                                        data-rule-id={rule.ruleId}
                                                        rows="3"
                                                    >{rule.formula}</textarea>
                                                </div>
                                            </div>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-top_xx-small">
                                                <lightning-button
                                                    label="Validate"
                                                    data-id="validate-formula"
                                                    data-rule-id={rule.ruleId}
                                                    onclick={handleValidateFormula}
                                                ></lightning-button>
                                                <lightning-button
                                                    label="Save rule"
                                                    variant="brand-outline"
                                                    class="slds-m-left_x-small"
                                                    data-id="save-formula"
                                                    data-rule-id={rule.ruleId}
                                                    onclick={handleSaveFormula}
                                                ></lightning-button>
                                                <template lwc:if={rule.feedbackMessage}>
                                                    <span class={rule.feedbackClass} data-id="formula-feedback">{rule.feedbackMessage}</span>
                                                </template>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                $Permission, $Profile, $User and $UserRole are available · picklists need ISPICKVAL() · 3,900 characters max
                                            </p>
                                            <template lwc:if={rule.predicatePills.length}>
                                                <div class="slds-m-top_x-small">
                                                    <template for:each={rule.predicatePills} for:item="pill">
                                                        <span key={pill.key} class="slds-badge slds-m-right_x-small" data-id="predicate-pill">{pill.label}</span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak slds-text-align_center slds-p-top_large">
                                Select a card to see its detail.
                            </p>
                        </template>
                    </div>
                </div>
                </div>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={activationOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="activation-title" class="slds-modal slds-fade-in-open" data-id="activation-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="activation-title" class="slds-modal__title">Activate card</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={activationChecklist} for:item="check">
                        <div key={check.key} class={check.boxClass} data-id="activation-check">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name={check.iconName} variant={check.iconVariant} size="x-small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <strong>{check.text}</strong>
                                    <p class="slds-text-body_small slds-text-color_weak">{check.detail}</p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        data-id="activate-cancel"
                        onclick={handleCloseActivation}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Activate card"
                        class="slds-m-left_x-small"
                        data-id="activate-confirm"
                        onclick={handleConfirmActivation}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
