<template>
    <div class="slds-page-header slds-m-bottom_x-small">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:settings" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1>
                                    <span class="slds-page-header__title slds-truncate" title="Vista 360 Configuration">
                                        Vista 360 Configuration
                                    </span>
                                </h1>
                            </div>
                        </div>
                        <p class="slds-page-header__name-meta" data-id="header-meta">{headerMeta}</p>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__col-actions">
                <div class="slds-page-header__controls">
                    <div class="slds-page-header__control">
                        <lightning-button-icon
                            icon-name="utility:help"
                            variant="border-filled"
                            alternative-text="Help"
                            title="Help"
                            data-id="help-open"
                            onclick={handleOpenHelp}
                        ></lightning-button-icon>
                    </div>
                    <div class="slds-page-header__control">
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            variant="border-filled"
                            alternative-text="Refresh"
                            title="Refresh"
                            data-id="refresh"
                            onclick={handleRefresh}
                        ></lightning-button-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="slds-card">
        <div class="slds-p-around_medium">
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-p-around_xx-large" data-id="loading-state">
                    <lightning-spinner alternative-text="Loading configuration" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={isError}>
                <c-v360-empty-state
                    data-id="error-state"
                    title="Something went wrong"
                    illustration-name="error:recoverable"
                    alternative-text="Error illustration"
                    description="Unable to load the Vista 360 configuration right now."
                    retry-label="Retry"
                    onretry={handleRetry}
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isDenied}>
                <c-v360-empty-state
                    data-id="denied-state"
                    title="Access needed"
                    illustration-name="access:request"
                    alternative-text="No access illustration"
                    description="Managing Vista 360 cards requires the V360 Admin permission set."
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isEmpty}>
                <c-v360-empty-state
                    data-id="empty-state"
                    title="No configuration yet"
                    illustration-name="noresults:unknown"
                    alternative-text="No results illustration"
                    description="No Vista 360 tabs are configured in this org."
                ></c-v360-empty-state>
            </template>

            <template lwc:elseif={isCatalogVisible}>
                <div class="slds-is-relative">
                <template lwc:if={refreshing}>
                    <lightning-spinner
                        alternative-text="Saving changes"
                        size="small"
                        data-id="refresh-spinner"
                    ></lightning-spinner>
                </template>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-large-size_2-of-12">
                        <lightning-vertical-navigation
                            selected-item={selectedTabId}
                            onselect={handleTabSelect}
                            data-id="tab-navigation"
                        >
                            <template for:each={navigationSections} for:item="section">
                                <lightning-vertical-navigation-section
                                    key={section.sObjectApiName}
                                    label={section.sObjectApiName}
                                >
                                    <template for:each={section.tabs} for:item="navTab">
                                        <lightning-vertical-navigation-item
                                            key={navTab.tabId}
                                            label={navTab.navLabel}
                                            name={navTab.tabId}
                                        ></lightning-vertical-navigation-item>
                                    </template>
                                </lightning-vertical-navigation-section>
                            </template>
                        </lightning-vertical-navigation>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12 slds-large-size_6-of-12" data-id="workspace">
                        <template lwc:if={workspace}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <div class="slds-grow">
                                    <h2 class="slds-text-heading_small" data-id="workspace-title">{workspace.title}</h2>
                                    <p class="slds-text-body_small slds-text-color_weak">{workspace.subtitle}</p>
                                </div>
                                <span class="slds-m-right_x-small slds-text-body_small slds-text-color_weak">
                                    {workspace.cardCountLabel}
                                </span>
                                <span class={workspace.statusClass}>{workspace.statusLabel}</span>
                                <lightning-button
                                    variant="brand"
                                    label="New card"
                                    class="slds-m-left_x-small"
                                    data-id="new-card"
                                    onclick={handleNewCard}
                                ></lightning-button>
                            </div>

                            <template lwc:if={workspace.hasNoCards}>
                                <c-v360-empty-state
                                    data-id="workspace-empty"
                                    title="No cards in this tab"
                                    illustration-name="noresults:unknown"
                                    alternative-text="No results illustration"
                                    description="Create the first card for this tab. New cards start as drafts, invisible to end users until you activate them."
                                ></c-v360-empty-state>
                            </template>
                            <template for:each={workspace.cards} for:item="card">
                                <div
                                    key={card.cardId}
                                    class={card.rowClass}
                                    data-id="card-row"
                                    data-card-id={card.cardId}
                                    role="button"
                                    tabindex="0"
                                    aria-pressed={card.isSelected}
                                    onclick={handleCardOpen}
                                    onkeydown={handleCardKeydown}
                                >
                                    <div class="slds-media__figure slds-media__figure_fixed-width slds-align_absolute-center">
                                        <lightning-icon icon-name={card.iconNameOrDefault} size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body slds-border_left slds-p-left_small">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="slds-text-heading_small slds-truncate slds-m-right_x-small">{card.label}</span>
                                            <span class={card.stateClass} data-id="card-state">{card.stateLabel}</span>
                                        </div>
                                        <p class="slds-text-body_small slds-text-color_weak slds-truncate">
                                            {card.developerName} · {card.binding}
                                        </p>
                                        <p class="slds-text-body_small slds-truncate" data-id="rule-summary">{card.ruleSummary}</p>
                                    </div>
                                    <div class="slds-media__figure slds-media__figure_reverse slds-align_absolute-center">
                                        <div class="slds-grid slds-grid_vertical">
                                            <lightning-button-icon
                                                icon-name="utility:arrowup"
                                                variant="border-filled"
                                                size="small"
                                                alternative-text="Move up"
                                                title="Move up"
                                                data-id="move-up"
                                                data-card-id={card.cardId}
                                                disabled={card.moveUpDisabled}
                                                onclick={handleMoveUp}
                                                class="slds-m-bottom_xx-small"
                                            ></lightning-button-icon>
                                            <lightning-button-icon
                                                icon-name="utility:arrowdown"
                                                variant="border-filled"
                                                size="small"
                                                alternative-text="Move down"
                                                title="Move down"
                                                data-id="move-down"
                                                data-card-id={card.cardId}
                                                disabled={card.moveDownDisabled}
                                                onclick={handleMoveDown}
                                            ></lightning-button-icon>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12" data-id="detail-panel">
                        <template lwc:if={detail}>
                            <div class="slds-box slds-box_small slds-theme_shade">
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                    <lightning-icon
                                        icon-name={detail.iconNameOrDefault}
                                        size="small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    <h3 class="slds-text-heading_small slds-grow slds-truncate" data-id="detail-title">{detail.label}</h3>
                                    <span class={detail.stateClass}>{detail.stateLabel}</span>
                                </div>

                                <template lwc:if={detail.isDraft}>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_info slds-m-bottom_small" role="status" data-id="draft-banner">
                                        <div class="slds-media__body slds-grid slds-grid_vertical-align-center">
                                            <p class="slds-grow slds-m-right_x-small">This card is a draft — end users can't see it yet.</p>
                                            <lightning-button
                                                variant="brand"
                                                label="Activate…"
                                                data-id="activate-open"
                                                onclick={handleOpenActivation}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:if={detail.isKilled}>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_small" role="status" data-id="kill-banner">
                                        <div class="slds-media__body slds-grid slds-grid_vertical-align-center">
                                            <p class="slds-grow slds-m-right_x-small">The kill switch is on — this card is hidden everywhere and rules are not evaluated.</p>
                                            <lightning-button
                                                label="Release"
                                                data-id="action-release-kill"
                                                disabled={busy}
                                                onclick={handleReleaseKillSwitch}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </template>

                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                    <div>
                                        <template lwc:if={detail.isLive}>
                                            <lightning-button
                                                label="Deactivate"
                                                data-id="action-deactivate"
                                                disabled={busy}
                                                onclick={handleDeactivate}
                                                class="slds-m-right_x-small"
                                            ></lightning-button>
                                            <lightning-button
                                                label="Kill switch"
                                                variant="destructive-text"
                                                data-id="action-kill"
                                                disabled={busy}
                                                onclick={handleEngageKillSwitch}
                                            ></lightning-button>
                                        </template>
                                    </div>
                                    <lightning-button
                                        label="Delete card"
                                        variant="destructive-text"
                                        data-id="action-delete-card"
                                        disabled={busy}
                                        onclick={handleRequestDeleteCard}
                                    ></lightning-button>
                                </div>

                                <div class="slds-box slds-box_small slds-theme_default slds-m-bottom_small">
                                    <p class="slds-text-title_caps slds-m-bottom_x-small">Properties</p>
                                    <lightning-input
                                        label="Label"
                                        value={detail.label}
                                        data-id="prop-label"
                                    ></lightning-input>
                                    <lightning-textarea
                                        label="Description"
                                        value={detail.description}
                                        max-length="1000"
                                        data-id="prop-description"
                                        field-level-help="Shown on the gallery tile and under the title of the focused view."
                                    ></lightning-textarea>
                                    <div class="slds-grid slds-grid_vertical-align-end">
                                        <div class="slds-grow">
                                            <lightning-input
                                                label="Icon"
                                                value={detail.iconName}
                                                data-id="prop-icon"
                                                field-level-help="An SLDS icon name, like standard:account or utility:screen. The preview updates as you type."
                                                onchange={handleIconInput}
                                            ></lightning-input>
                                        </div>
                                        <div class="slds-grow-none slds-p-left_x-small slds-p-bottom_xx-small">
                                            <lightning-icon
                                                icon-name={iconPreviewName}
                                                size="small"
                                                data-id="icon-preview"
                                            ></lightning-icon>
                                        </div>
                                    </div>
                                    <lightning-combobox
                                        label="Component"
                                        value={detail.bindingValue}
                                        options={componentOptions}
                                        data-id="prop-component"
                                        field-level-help="LWC options come from the card registry; Flow bindings are validated as active screen flows on save."
                                    ></lightning-combobox>
                                    <lightning-input
                                        label="Tile button label"
                                        value={detail.buttonLabel}
                                        data-id="prop-button-label"
                                    ></lightning-input>
                                    <div class="slds-m-top_small slds-text-align_right">
                                        <lightning-button
                                            variant="brand"
                                            label="Save card"
                                            data-id="save-properties"
                                            disabled={busy}
                                            onclick={handleSaveProperties}
                                        ></lightning-button>
                                    </div>
                                </div>

                                <div class="slds-box slds-box_small slds-theme_default">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                        <p class="slds-text-title_caps slds-grow">Visibility rules</p>
                                        <lightning-button
                                            label="Add rule"
                                            data-id="add-rule"
                                            onclick={handleAddRule}
                                        ></lightning-button>
                                    </div>
                                    <template lwc:if={detail.hasNoRules}>
                                        <p class="slds-text-body_small" data-id="no-rules-note">
                                            No rules yet. Without rules this card is visible to everyone who can see the page.
                                        </p>
                                    </template>
                                    <template for:each={detail.rules} for:item="rule">
                                        <div key={rule.ruleId} class="slds-box slds-box_x-small slds-m-bottom_x-small" data-id="rule">
                                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                                <span class="slds-text-heading_small slds-grow slds-truncate">{rule.developerName}</span>
                                                <span class={rule.activeClass}>{rule.activeLabel}</span>
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    variant="bare"
                                                    size="small"
                                                    alternative-text="Delete rule"
                                                    title="Delete rule"
                                                    class="slds-m-left_x-small"
                                                    data-id="delete-rule"
                                                    data-rule-id={rule.ruleId}
                                                    disabled={busy}
                                                    onclick={handleRequestDeleteRule}
                                                ></lightning-button-icon>
                                            </div>
                                            <div class="slds-form-element">
                                                <label class="slds-form-element__label" for={rule.formulaFieldId}>Visibility formula</label>
                                                <div class="slds-form-element__control">
                                                    <textarea
                                                        id={rule.formulaFieldId}
                                                        class="slds-textarea v360-admin-formula"
                                                        data-id={rule.formulaFieldId}
                                                        data-rule-id={rule.ruleId}
                                                        rows="3"
                                                    >{rule.formula}</textarea>
                                                </div>
                                            </div>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap slds-m-top_xx-small">
                                                <lightning-button
                                                    label="Validate"
                                                    data-id="validate-formula"
                                                    disabled={busy}
                                                    data-rule-id={rule.ruleId}
                                                    onclick={handleValidateFormula}
                                                ></lightning-button>
                                                <lightning-button
                                                    label="Save rule"
                                                    variant="brand-outline"
                                                    disabled={busy}
                                                    class="slds-m-left_x-small"
                                                    data-id="save-formula"
                                                    data-rule-id={rule.ruleId}
                                                    onclick={handleSaveFormula}
                                                ></lightning-button>
                                                <template lwc:if={rule.feedbackMessage}>
                                                    <span class={rule.feedbackClass} data-id="formula-feedback">{rule.feedbackMessage}</span>
                                                </template>
                                            </div>
                                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                $Permission, $Profile, $User and $UserRole are available · picklists need ISPICKVAL() · 3,900 characters max
                                            </p>
                                            <template lwc:if={rule.predicatePills.length}>
                                                <div class="slds-m-top_x-small">
                                                    <template for:each={rule.predicatePills} for:item="pill">
                                                        <lightning-pill
                                                            key={pill.key}
                                                            label={pill.label}
                                                            class="slds-m-right_x-small"
                                                            data-id="predicate-pill"
                                                            data-predicate-id={pill.predicateId}
                                                            onremove={handleRemovePredicate}
                                                        ></lightning-pill>
                                                    </template>
                                                </div>
                                            </template>
                                            <div class="slds-grid slds-grid_vertical-align-end slds-m-top_x-small">
                                                <div class="slds-size_1-of-3">
                                                    <lightning-combobox
                                                        label="Predicate"
                                                        value="PERMISSION_SET"
                                                        options={predicateTypeOptions}
                                                        data-id={rule.predicateTypeFieldId}
                                                    ></lightning-combobox>
                                                </div>
                                                <div class="slds-grow slds-p-horizontal_x-small">
                                                    <lightning-input
                                                        label="Target API name"
                                                        placeholder="Permission set or field API name"
                                                        data-id={rule.predicateTargetFieldId}
                                                    ></lightning-input>
                                                </div>
                                                <lightning-button
                                                    label="Add"
                                                    data-id="add-predicate"
                                                    data-rule-id={rule.ruleId}
                                                    disabled={busy}
                                                    onclick={handleAddPredicate}
                                                ></lightning-button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <p class="slds-text-color_weak slds-text-align_center slds-p-top_large">
                                Select a card to see its detail.
                            </p>
                        </template>
                    </div>
                </div>
                </div>
            </template>
        </div>
    </div>

    <template lwc:if={helpOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="help-title" class="slds-modal slds-fade-in-open" data-id="help-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="help-title" class="slds-modal__title">How Vista 360 configuration works</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <ul class="slds-list_dotted">
                        <li class="slds-m-bottom_x-small">
                            <strong>Tabs</strong> group cards under an anchor object. Each tab is one Vista 360 surface on that object's record page.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Cards</strong> bind to a registered Lightning component or an active screen flow. The component picker only offers registered components, so a saved binding always resolves.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Drafts</strong>: an inactive card is invisible to end users. Configure it fully, then activate it from its detail panel.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Visibility rules</strong> decide who sees a live card. A card with no rules is visible to everyone who can see the page.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Formulas</strong> can use $Permission, $Profile, $User and $UserRole; picklist fields need ISPICKVAL(); 3,900 characters max. Validate before saving.
                        </li>
                        <li>
                            <strong>Kill switch</strong> hides a card everywhere instantly, without evaluating any rule. Use it for incidents.
                        </li>
                    </ul>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        data-id="help-close"
                        onclick={handleCloseHelp}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={newCardOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="new-card-title" class="slds-modal slds-fade-in-open" data-id="new-card-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="new-card-title" class="slds-modal__title">New card</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small slds-text-body_small slds-text-color_weak">
                        The card is created as a draft — end users won't see it until you activate it.
                    </p>
                    <lightning-input
                        label="Developer name"
                        required
                        field-level-help="Stable unique name, e.g. V360AccountRisk."
                        data-id="nc-devname"
                    ></lightning-input>
                    <lightning-input label="Label" required data-id="nc-label"></lightning-input>
                    <lightning-textarea label="Description" max-length="1000" data-id="nc-description"></lightning-textarea>
                    <lightning-input
                        label="Icon"
                        placeholder="standard:account"
                        data-id="nc-icon"
                    ></lightning-input>
                    <lightning-input label="Tile button label" placeholder="Consultar" data-id="nc-button-label"></lightning-input>
                    <lightning-combobox
                        label="Component type"
                        value={newCardType}
                        options={newCardTypeOptions}
                        data-id="nc-type"
                        onchange={handleNewCardTypeChange}
                    ></lightning-combobox>
                    <template lwc:if={isNewCardLwc}>
                        <lightning-combobox
                            label="Component"
                            options={componentOptions}
                            data-id="nc-component"
                            field-level-help="Only registered card components can be bound."
                        ></lightning-combobox>
                    </template>
                    <template lwc:else>
                        <lightning-input
                            label="Screen flow API name"
                            data-id="nc-flow"
                            field-level-help="Must name an active screen flow; validated on save."
                        ></lightning-input>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="nc-cancel" onclick={handleCloseNewCard}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Create draft"
                        class="slds-m-left_x-small"
                        data-id="nc-create"
                        disabled={busy}
                        onclick={handleCreateCard}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={addRuleOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="new-rule-title" class="slds-modal slds-fade-in-open" data-id="new-rule-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="new-rule-title" class="slds-modal__title">Add visibility rule</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Developer name"
                        required
                        field-level-help="Stable unique name, e.g. BankingAdvisorsOnly."
                        data-id="nr-devname"
                    ></lightning-input>
                    <div class="slds-form-element slds-m-top_x-small">
                        <label class="slds-form-element__label" for="nr-formula">Visibility formula (optional)</label>
                        <div class="slds-form-element__control">
                            <textarea id="nr-formula" class="slds-textarea v360-admin-formula" rows="3" data-id="nr-formula"></textarea>
                        </div>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            $Permission, $Profile, $User and $UserRole are available · picklists need ISPICKVAL() · validated on save. You can add structured predicates after creating the rule.
                        </p>
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="nr-cancel" onclick={handleCloseAddRule}></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Create rule"
                        class="slds-m-left_x-small"
                        data-id="nr-create"
                        disabled={busy}
                        onclick={handleCreateRule}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={deleteTarget}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="delete-title" class="slds-modal slds-fade-in-open" data-id="delete-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="delete-title" class="slds-modal__title">Confirm deletion</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p data-id="delete-message">{deleteMessage}</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="delete-cancel" onclick={handleCancelDelete}></lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Delete"
                        class="slds-m-left_x-small"
                        data-id="delete-confirm"
                        disabled={busy}
                        onclick={handleConfirmDelete}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={activationOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="activation-title" class="slds-modal slds-fade-in-open" data-id="activation-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="activation-title" class="slds-modal__title">Activate card</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template for:each={activationChecklist} for:item="check">
                        <div key={check.key} class={check.boxClass} data-id="activation-check">
                            <div class="slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name={check.iconName} variant={check.iconVariant} size="x-small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <strong>{check.text}</strong>
                                    <p class="slds-text-body_small slds-text-color_weak">{check.detail}</p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        data-id="activate-cancel"
                        onclick={handleCloseActivation}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Activate card"
                        class="slds-m-left_x-small"
                        data-id="activate-confirm"
                        onclick={handleConfirmActivation}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
