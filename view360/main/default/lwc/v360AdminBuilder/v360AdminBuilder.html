<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_xx-large" data-id="loading">
            <lightning-spinner alternative-text="Loading configuration" size="small"></lightning-spinner>
        </div>
    </template>

    <template lwc:elseif={isError}>
        <c-empty-state
            data-id="error-state"
            title="Something went wrong"
            illustration-name="error:recoverable"
            alternative-text="Error illustration"
            description="Unable to load the Vista 360 configuration right now."
            retry-label="Retry"
            onretry={handleRetry}
        ></c-empty-state>
    </template>

    <template lwc:elseif={isDenied}>
        <c-empty-state
            data-id="denied-state"
            title="Access needed"
            illustration-name="access:request"
            alternative-text="No access illustration"
            description="Managing Vista 360 cards requires the V360 Admin permission set."
        ></c-empty-state>
    </template>

    <template lwc:elseif={isEmptyOrg}>
        <c-empty-state
            data-id="empty-org"
            title="No configuration yet"
            illustration-name="noresults:unknown"
            alternative-text="No results illustration"
            description="No Vista 360 tabs are configured in this org. A tab is a named surface anchored to one object; create the first one, then add cards to it."
        >
            <lightning-button
                slot="cta"
                variant="brand"
                label="New tab"
                data-id="empty-new-tab"
                onclick={handleNewTab}
            ></lightning-button>
        </c-empty-state>
    </template>

    <template lwc:elseif={isReady}>
        <div class="v360-builder slds-is-relative">
            <!-- The document header: what is open, and the control that changes it.
                 SLDS's own builder-header blueprint, the same chrome App Builder and
                 Agentforce Builder wear. -->
            <!-- slds-builder-header_container is deliberately absent. Everything
                 that class does is pin itself to the viewport -- position:fixed,
                 top, left, width, z-index -- which is right for a builder app
                 that owns the window and lands on top of Salesforce's navigation
                 inside a Lightning tab. It carries nothing visual; the header
                 element below holds all of that. -->
            <div class="v360-builder-header">
                <header class="slds-builder-header">
                    <div class="slds-builder-header__item">
                        <div class="slds-builder-header__item-label slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="utility:builder"
                                    size="x-small"
                                    variant="inverse"
                                ></lightning-icon>
                            </div>
                            <div class="slds-media__body">Vista 360</div>
                        </div>
                    </div>

                    <nav class="slds-builder-header__item slds-builder-header__nav">
                        <ul class="slds-builder-header__nav-list">
                            <!-- The tab switcher is a menu, not a list of links, so it
                                 carries the menu button contract end to end: the trigger
                                 owns aria-haspopup/expanded and points at the menu it
                                 controls, the options are single-choice items that say
                                 which one is open, and the whole thing is driven from the
                                 keyboard. Options and actions are two different kinds of
                                 row, so a divider separates them. -->
                            <li class={switcherClass} onfocusout={handleSwitcherFocusOut}>
                                <button
                                    class="slds-button slds-builder-header__item-action slds-media slds-media_center"
                                    aria-haspopup="menu"
                                    aria-expanded={switcherExpanded}
                                    aria-controls="tab-menu"
                                    title="Switch tab"
                                    data-id="tab-switcher"
                                    onclick={handleToggleSwitcher}
                                    onkeydown={handleTriggerKeyDown}
                                >
                                    <span class="slds-media__figure">
                                        <lightning-icon
                                            icon-name="utility:page"
                                            size="x-small"
                                            variant="inverse"
                                        ></lightning-icon>
                                    </span>
                                    <span class="slds-media__body slds-grid slds-grid_vertical-align-center">
                                        <span class="slds-truncate" title={documentName}>{documentName}</span>
                                        <lightning-icon
                                            icon-name="utility:chevrondown"
                                            size="xx-small"
                                            variant="inverse"
                                            class="slds-m-left_small"
                                        ></lightning-icon>
                                    </span>
                                </button>
                                <div
                                    id="tab-menu"
                                    class="slds-dropdown slds-dropdown_left slds-dropdown_small"
                                    role="menu"
                                    aria-label="Tabs"
                                    data-id="tab-menu"
                                    onkeydown={handleMenuKeyDown}
                                >
                                    <!-- The search field appears only once the list stops
                                         being readable at a glance. Above three tabs it is
                                         a box to skip past; above a screenful it is the
                                         only way to reach the bottom of the list quickly. -->
                                    <template lwc:if={isTabMenuSearchable}>
                                        <div class="slds-dropdown__header slds-p-horizontal_x-small slds-p-vertical_xx-small">
                                            <div class="slds-form-element">
                                                <label class="slds-form-element__label slds-assistive-text" for="tab-filter">
                                                    Search tabs
                                                </label>
                                                <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">
                                                    <lightning-icon
                                                        icon-name="utility:search"
                                                        size="x-small"
                                                        class="slds-input__icon slds-input__icon_left slds-icon-text-default"
                                                    ></lightning-icon>
                                                    <input
                                                        id="tab-filter"
                                                        type="text"
                                                        class="slds-input"
                                                        placeholder="Search tabs"
                                                        autocomplete="off"
                                                        data-id="tab-filter"
                                                        value={tabFilter}
                                                        oninput={handleTabFilter}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <ul
                                        class="slds-dropdown__list slds-dropdown_length-with-icon-10"
                                        role="presentation"
                                    >
                                        <template for:each={menuGroups} for:item="group">
                                            <li
                                                key={group.sObjectApiName}
                                                class="slds-dropdown__header slds-truncate"
                                                role="separator"
                                            >
                                                <span data-id="tab-group" title={group.sObjectApiName}>
                                                    {group.sObjectApiName}
                                                </span>
                                            </li>
                                            <template for:each={group.tabs} for:item="groupTab">
                                                <li
                                                    key={groupTab.tabId}
                                                    class={groupTab.itemClass}
                                                    role="presentation"
                                                >
                                                    <a
                                                        role="menuitemradio"
                                                        aria-checked={groupTab.ariaChecked}
                                                        tabindex="-1"
                                                        data-menu-item="true"
                                                        data-id="tab-option"
                                                        data-tab-id={groupTab.tabId}
                                                        onclick={handleTabPick}
                                                    >
                                                        <span class="slds-truncate" title={groupTab.developerName}>
                                                            <lightning-icon
                                                                icon-name="utility:check"
                                                                size="xx-small"
                                                                class={groupTab.checkClass}
                                                            ></lightning-icon>
                                                            {groupTab.developerName}
                                                        </span>
                                                    </a>
                                                </li>
                                            </template>
                                        </template>

                                        <!-- A menu that goes blank reads as broken; say what
                                             happened instead. -->
                                        <template lwc:if={hasNoTabMatch}>
                                            <li class="slds-dropdown__item" role="presentation">
                                                <span
                                                    class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_small slds-text-color_weak"
                                                    data-id="tab-menu-empty"
                                                >
                                                    No tab matches “{tabFilter}”.
                                                </span>
                                            </li>
                                        </template>

                                        <li class="slds-dropdown__item slds-has-divider_top-space" role="presentation">
                                            <a
                                                role="menuitem"
                                                tabindex="-1"
                                                data-menu-item="true"
                                                data-id="edit-tab"
                                                onclick={handleEditTab}
                                            >
                                                <span class="slds-truncate" title="Edit this tab">
                                                    <lightning-icon
                                                        icon-name="utility:edit"
                                                        size="xx-small"
                                                        class="slds-icon-text-default slds-m-right_x-small"
                                                    ></lightning-icon>
                                                    Edit this tab…
                                                </span>
                                            </a>
                                        </li>
                                        <li class="slds-dropdown__item" role="presentation">
                                            <a
                                                role="menuitem"
                                                tabindex="-1"
                                                data-menu-item="true"
                                                data-id="new-tab"
                                                onclick={handleNewTab}
                                            >
                                                <span class="slds-truncate" title="New tab">
                                                    <lightning-icon
                                                        icon-name="utility:add"
                                                        size="xx-small"
                                                        class="slds-icon-text-default slds-m-right_x-small"
                                                    ></lightning-icon>
                                                    New tab…
                                                </span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </li>
                        </ul>
                    </nav>

                    <div class="slds-builder-header__item slds-has-flexi-truncate">
                        <h1 class="slds-builder-header__item-label">
                            <span class="slds-truncate" title={documentMeta} data-id="document-meta">
                                {documentMeta}
                            </span>
                        </h1>
                    </div>

                    <div class="slds-builder-header__item slds-builder-header__utilities">
                        <div class="slds-builder-header__utilities-item">
                            <a
                                class="slds-builder-header__item-action slds-media slds-media_center"
                                data-id="help"
                                onclick={handleOpenHelp}
                            >
                                <span class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="utility:help"
                                        size="x-small"
                                        variant="inverse"
                                    ></lightning-icon>
                                </span>
                                <span class="slds-media__body">Help</span>
                            </a>
                        </div>
                        <div class="slds-builder-header__utilities-item">
                            <a
                                class="slds-builder-header__item-action slds-media slds-media_center"
                                data-id="refresh"
                                onclick={handleRefresh}
                            >
                                <span class="slds-media__figure">
                                    <lightning-icon
                                        icon-name="utility:refresh"
                                        size="x-small"
                                        variant="inverse"
                                    ></lightning-icon>
                                </span>
                                <span class="slds-media__body">Refresh</span>
                            </a>
                        </div>
                    </div>
                </header>

                <!-- The toolbar: what is true of the whole tab, and what can be
                     done to it. Everything above this line names the open
                     document; everything below edits one card at a time. This
                     row is the only place the tab is addressed as a whole.

                     Save and Save As are deliberately absent. The blueprint
                     carries them because a builder holds an unsaved document;
                     this one does not -- every action here writes through on
                     its own -- and a Save button over a builder that has already
                     saved is a button that lies. Undo and redo are absent for
                     the same reason: there is no in-memory document to step
                     back through. -->
                <div
                    class="slds-builder-toolbar"
                    role="toolbar"
                    aria-label="Tab actions"
                    data-id="builder-toolbar"
                >
                    <!-- __actions is the blueprint's right-hand region and pushes
                         itself over; __item-group is the row of controls inside
                         it. The left group the blueprint fills with undo and redo
                         is absent, not empty -- see above. -->
                    <div class="slds-builder-toolbar__actions">
                        <div class="slds-builder-toolbar__item-group">
                            <!-- A live card no active rule restricts is visible
                                 to everyone, which is this product's one real
                                 hazard. Every other surface reports it for the
                                 open card only, so the tab's own count exists
                                 nowhere else. -->
                            <template lwc:if={hasExposedCards}>
                                <button
                                    class="slds-button v360-builder-exposure"
                                    type="button"
                                    title={exposureTitle}
                                    data-id="exposure-indicator"
                                    onclick={handleOpenFirstExposedCard}
                                >
                                    <lightning-icon
                                        icon-name="utility:warning"
                                        size="x-small"
                                        variant="warning"
                                        class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    <span>{exposureLabel}</span>
                                </button>
                            </template>

                            <button
                                class="slds-button slds-button_neutral slds-m-left_x-small"
                                type="button"
                                data-id="preview"
                                onclick={handleOpenPreview}
                            >
                                <lightning-icon
                                    icon-name="utility:preview"
                                    size="xx-small"
                                    class="slds-m-right_xx-small"
                                ></lightning-icon>
                                Preview
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="v360-builder-body">
                <template lwc:if={refreshing}>
                    <lightning-spinner alternative-text="Saving" size="small" data-id="busy"></lightning-spinner>
                </template>

                <!-- The rail: which question about the open card the canvas answers.
                     Tabs, not navigation, so it carries tablist semantics. It leads
                     the row so focus order matches what the eye reads first. -->
                <div
                    class="v360-builder-rail"
                    role="tablist"
                    aria-orientation="vertical"
                    aria-label="Card sections"
                >
                    <template for:each={rail} for:item="section">
                        <button
                            key={section.key}
                            type="button"
                            role="tab"
                            class={section.itemClass}
                            aria-selected={section.isSelected}
                            tabindex={section.tabIndex}
                            title={section.title}
                            data-id="rail-item"
                            data-section={section.key}
                            onclick={handleSectionSelect}
                        >
                            <lightning-icon icon-name={section.iconName} size="small"></lightning-icon>
                            <span class="v360-builder-rail-label">{section.label}</span>
                            <template lwc:if={section.hasBadge}>
                                <span class={section.badgeClass} data-id="rail-badge">{section.badgeLabel}</span>
                            </template>
                        </button>
                    </template>
                </div>

                <!-- Cards: which card the canvas is about. -->
                <div class="v360-builder-list">
                    <div class="v360-builder-list-head">
                        <span class="slds-text-title_caps slds-grow">Cards</span>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-right_x-small">
                            {cardListCount}
                        </span>
                        <lightning-button-icon
                            icon-name="utility:add"
                            variant="brand"
                            size="small"
                            alternative-text="New card"
                            title="New card"
                            data-id="new-card"
                            disabled={busy}
                            onclick={handleNewCard}
                        ></lightning-button-icon>
                    </div>
                    <div class="v360-builder-list-scroll">
                        <template lwc:if={hasNoCards}>
                            <c-empty-state
                                data-id="no-cards"
                                size="small"
                                title="No cards yet"
                                illustration-name="noresults:unknown"
                                alternative-text="No results illustration"
                                description="This tab renders nothing until it has a card."
                            ></c-empty-state>
                        </template>
                        <template for:each={cardList} for:item="row">
                            <div
                                key={row.cardId}
                                class={row.rowClass}
                                role="button"
                                tabindex="0"
                                aria-pressed={row.isSelected}
                                data-id="card-row"
                                data-card-id={row.cardId}
                                onclick={handleCardSelect}
                                onkeydown={handleCardKeydown}
                            >
                                <lightning-icon
                                    icon-name={row.iconNameOrDefault}
                                    size="small"
                                    class="v360-builder-cardrow-icon"
                                ></lightning-icon>
                                <div class="v360-builder-cardrow-body">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <span class="slds-text-heading_small slds-truncate slds-m-right_x-small">
                                            {row.label}
                                        </span>
                                        <span class={row.stateClass}>{row.stateLabel}</span>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-truncate">
                                        {row.binding}
                                    </p>
                                    <p class="slds-text-body_small slds-truncate" title={row.ruleSummary}>
                                        {row.ruleSummary}
                                    </p>
                                </div>
                                <div class="v360-builder-cardrow-move">
                                    <lightning-button-icon
                                        icon-name="utility:arrowup"
                                        variant="border-filled"
                                        size="small"
                                        alternative-text="Move up"
                                        title="Move up"
                                        data-id="move-up"
                                        data-card-id={row.cardId}
                                        disabled={row.upDisabled}
                                        onclick={handleMoveUp}
                                        class="slds-m-bottom_xx-small"
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        icon-name="utility:arrowdown"
                                        variant="border-filled"
                                        size="small"
                                        alternative-text="Move down"
                                        title="Move down"
                                        data-id="move-down"
                                        data-card-id={row.cardId}
                                        disabled={row.downDisabled}
                                        onclick={handleMoveDown}
                                    ></lightning-button-icon>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- The canvas: one section at a time, with room for a formula. -->
                <div class="v360-builder-canvas">
                    <template lwc:if={detail}>
                        <div class="v360-builder-canvas-head">
                            <p
                                class="slds-text-body_small slds-text-color_weak slds-truncate"
                                title={breadcrumb}
                                data-id="breadcrumb"
                            >
                                {breadcrumb}
                            </p>
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-top_xx-small">
                                <lightning-icon
                                    icon-name={detail.iconNameOrDefault}
                                    size="small"
                                    class="slds-m-right_x-small"
                                ></lightning-icon>
                                <h2 class="slds-text-heading_medium slds-truncate slds-grow" data-id="canvas-title">
                                    {detail.label}
                                </h2>
                                <span class={detail.stateClass}>{detail.stateLabel}</span>
                            </div>
                        </div>

                        <div class="v360-builder-canvas-scroll">
                            <template lwc:if={showExposureBanner}>
                                <div
                                    class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_small"
                                    role="status"
                                    data-id="exposure-banner"
                                >
                                    <div class="slds-media__figure">
                                        <lightning-icon
                                            icon-name="utility:warning"
                                            size="x-small"
                                            variant="warning"
                                        ></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <p>{exposureNote}</p>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={isTileSection}>
                                <div class="slds-box slds-box_small slds-theme_default v360-builder-measure">
                                    <p class="slds-text-title_caps slds-m-bottom_x-small">Presentation</p>
                                    <div class="slds-grid slds-gutters_x-small slds-wrap">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input
                                                label="Label"
                                                required
                                                value={detail.label}
                                                data-id="tile-label"
                                            ></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input
                                                label="Tile button label"
                                                value={detail.buttonLabelOrDefault}
                                                data-id="tile-button-label"
                                            ></lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1">
                                            <!-- A plain SLDS button, not lightning-button: only a
                                                 value in this component's own light DOM can be
                                                 truncated, and icon references get long. -->
                                            <div class="slds-form-element">
                                                <span class="slds-form-element__label">Icon</span>
                                                <div class="slds-form-element__control">
                                                    <button
                                                        type="button"
                                                        class="slds-button slds-button_neutral v360-builder-icon-trigger"
                                                        title={tileIconLabel}
                                                        data-id="tile-icon"
                                                        data-target="tile"
                                                        onclick={handleOpenIconPicker}
                                                    >
                                                        <lightning-icon
                                                            icon-name={tileIconPreview}
                                                            size="x-small"
                                                            class="slds-m-right_x-small slds-shrink-none"
                                                        ></lightning-icon>
                                                        <span class="slds-truncate v360-builder-icon-value">
                                                            {tileIconLabel}
                                                        </span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1">
                                            <lightning-textarea
                                                label="Description"
                                                value={detail.description}
                                                max-length="1000"
                                                data-id="tile-description"
                                            ></lightning-textarea>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1">
                                            <lightning-combobox
                                                label="Component"
                                                value={detail.bindingValue}
                                                options={componentOptions}
                                                data-id="tile-component"
                                            ></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1">
                                            <lightning-input
                                                label="Developer name"
                                                value={detail.developerName}
                                                disabled
                                                data-id="tile-devname"
                                                field-level-help="Locked after creation: configuration is upserted between orgs on this name, so renaming would create a duplicate card on the next deployment instead of updating this one."
                                            ></lightning-input>
                                        </div>
                                    </div>
                                    <div class="slds-m-top_small slds-text-align_right">
                                        <lightning-button
                                            variant="brand"
                                            label="Save card"
                                            data-id="save-tile"
                                            disabled={busy}
                                            onclick={handleSaveTile}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </template>

                            <template lwc:elseif={isRulesSection}>
                                <template lwc:if={hasNoRules}>
                                    <div class="v360-builder-measure">
                                    <c-empty-state
                                        data-id="no-rules"
                                        boxed
                                        title="No visibility rules"
                                        illustration-name="noresults:unknown"
                                        alternative-text="No results illustration"
                                        description={exposureNote}
                                    >
                                        <lightning-button
                                            slot="cta"
                                            variant="brand"
                                            label="Add rule"
                                            data-id="add-rule"
                                            disabled={busy}
                                            onclick={handleNewRule}
                                        ></lightning-button>
                                    </c-empty-state>
                                    </div>
                                </template>

                                <template lwc:else>
                                <div class="v360-builder-measure">
                                <!-- The combinator is stated before the rules, not inferred from
                                     them: whether a second rule tightens the card or opens another
                                     way in is the single fact an admin most needs to be sure of,
                                     and it decides who sees data. -->
                                <div class="slds-grid slds-grid_vertical-align-start slds-m-bottom_small">
                                    <div class="slds-grow">
                                        <lightning-radio-group
                                            name="ruleMatchLogic"
                                            label="How these rules combine"
                                            type="button"
                                            options={matchLogicOptions}
                                            value={matchLogic}
                                            disabled={busy}
                                            data-id="match-logic"
                                            onchange={handleMatchLogicChange}
                                        ></lightning-radio-group>
                                        <p
                                            class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                                            data-id="match-logic-note"
                                        >{matchLogicNote}</p>
                                    </div>
                                    <!-- The same hidden label spacer the Add predicate button
                                         uses: without it the button sits level with the group's
                                         label instead of its buttons. Held at its natural width
                                         too, because the longer of the two combinator labels
                                         grows the group beside it and the button was the only
                                         thing left able to give, so it wrapped to "Add / rule". -->
                                    <div class="slds-form-element slds-shrink-none slds-m-left_small">
                                        <span
                                            class="slds-form-element__label slds-hidden"
                                            aria-hidden="true"
                                        >Add rule</span>
                                        <div class="slds-form-element__control">
                                            <lightning-button
                                                variant="brand"
                                                label="Add rule"
                                                data-id="add-rule"
                                                disabled={busy}
                                                onclick={handleNewRule}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </div>
                                <template lwc:if={detail.hasNoEnforcedRules}>
                                    <div
                                        class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-bottom_small"
                                        role="status"
                                        data-id="exposure-note"
                                    >
                                        <div class="slds-media__figure">
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                size="x-small"
                                                variant="warning"
                                            ></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <p>{exposureNote}</p>
                                        </div>
                                    </div>
                                </template>
                                <template for:each={rules} for:item="rule">
                                    <div key={rule.ruleId}>
                                    <!-- The joiner is drawn between the rules rather than stated
                                         once above them, so the reading is there at the moment the
                                         eye moves from one rule to the next. -->
                                    <template lwc:if={rule.showJoiner}>
                                        <div
                                            class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small"
                                            data-id="rule-joiner"
                                            aria-hidden="true"
                                        >
                                            <hr class="slds-grow slds-m-vertical_none" />
                                            <span class="slds-badge slds-m-horizontal_small">{ruleJoinerLabel}</span>
                                            <hr class="slds-grow slds-m-vertical_none" />
                                        </div>
                                    </template>
                                    <div
                                        class="slds-box slds-box_small slds-theme_default slds-m-bottom_small"
                                        data-id="rule"
                                    >
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                            <span class="slds-text-heading_small slds-grow slds-truncate">
                                                {rule.developerName}
                                            </span>
                                            <span class={rule.stateClass}>{rule.stateLabel}</span>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                variant="bare"
                                                size="small"
                                                alternative-text="Delete rule"
                                                title="Delete rule"
                                                class="slds-m-left_x-small"
                                                data-id="delete-rule"
                                                data-rule-id={rule.ruleId}
                                                disabled={busy}
                                                onclick={handleDeleteRule}
                                            ></lightning-button-icon>
                                        </div>
                                        <c-v360-formula-editor
                                            formula={rule.formula}
                                            anchor-s-object={anchorSObject}
                                            feedback-message={rule.feedbackMessage}
                                            feedback-valid={rule.feedbackValid}
                                            busy={busy}
                                            data-id="formula-editor"
                                            data-rule-id={rule.ruleId}
                                            onvalidate={handleValidateFormula}
                                            onsave={handleSaveFormula}
                                        ></c-v360-formula-editor>

                                        <!-- Structured access the formula cannot express, enforced on
                                             top of it. The row aligns to the start so a field's
                                             validation error grows downward without shoving the
                                             button, and the button gets a hidden label spacer so its
                                             control lines up with the fields'. -->
                                        <div class="slds-m-top_medium">
                                            <!-- "Required" is true of what a rule asks for either
                                                 way; what changes with the mode is whether the
                                                 rule itself is a requirement or one route in. -->
                                            <p
                                                class="slds-text-title_caps slds-m-bottom_x-small"
                                                data-id="access-heading"
                                            >{accessHeading}</p>
                                            <div class="slds-grid slds-gutters_xx-small slds-grid_vertical-align-start">
                                                <div class="slds-col slds-size_5-of-12">
                                                    <lightning-combobox
                                                        label="Type"
                                                        value={rule.predicateType}
                                                        options={predicateTypeOptions}
                                                        data-id={rule.typeFieldId}
                                                        data-rule-id={rule.ruleId}
                                                        onchange={handlePredicateTypeChange}
                                                    ></lightning-combobox>
                                                </div>
                                                <div class="slds-col slds-size_5-of-12">
                                                    <c-search-picker
                                                        label={rule.predicateTargetLabel}
                                                        placeholder={rule.predicateTargetPlaceholder}
                                                        options={rule.predicateTargetOptions}
                                                        value={rule.predicateTarget}
                                                        disabled={busy}
                                                        data-id={rule.targetFieldId}
                                                        data-rule-id={rule.ruleId}
                                                        onselect={handlePredicateTargetSelect}
                                                    ></c-search-picker>
                                                </div>
                                                <div class="slds-col slds-size_2-of-12">
                                                    <div class="slds-form-element">
                                                        <span
                                                            class="slds-form-element__label slds-hidden"
                                                            aria-hidden="true"
                                                        >Add</span>
                                                        <div class="slds-form-element__control">
                                                            <lightning-button
                                                                label="Add"
                                                                data-id="add-predicate"
                                                                data-rule-id={rule.ruleId}
                                                                disabled={busy}
                                                                onclick={handleAddPredicate}
                                                            ></lightning-button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <template lwc:if={rule.predicateLabels.length}>
                                                <div class="slds-grid slds-wrap slds-m-top_x-small">
                                                    <template for:each={rule.predicateLabels} for:item="predicate">
                                                        <lightning-pill
                                                            key={predicate.key}
                                                            label={predicate.label}
                                                            class="slds-m-right_xx-small slds-m-bottom_xx-small"
                                                            data-id="predicate-pill"
                                                            data-predicate-id={predicate.predicateId}
                                                            onremove={handleRemovePredicate}
                                                        ></lightning-pill>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                                    None. The formula alone decides who sees this card.
                                                </p>
                                            </template>
                                        </div>
                                    </div>
                                    </div>
                                </template>
                                </div>
                                </template>
                            </template>

                            <template lwc:elseif={isReleaseSection}>
                                <div class="v360-builder-measure">
                                    <template for:each={releaseChecks} for:item="check">
                                        <div key={check.key} class={check.boxClass} data-id="release-check">
                                            <div class="slds-media slds-media_center">
                                                <div class="slds-media__figure">
                                                    <lightning-icon
                                                        icon-name={check.iconName}
                                                        variant={check.iconVariant}
                                                        size="x-small"
                                                    ></lightning-icon>
                                                </div>
                                                <div class="slds-media__body">
                                                    <strong>{check.text}</strong>
                                                    <p class="slds-text-body_small slds-text-color_weak">
                                                        {check.detail}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- One row: what this card's state can become on the
                                         leading edge, and the irreversible action on the
                                         trailing edge, away from the rest. -->
                                    <div
                                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small"
                                    >
                                        <div>
                                        <template lwc:if={detail.isDraft}>
                                            <lightning-button
                                                variant="brand"
                                                label="Activate card"
                                                data-id="activate"
                                                disabled={busy}
                                                onclick={handleActivate}
                                            ></lightning-button>
                                        </template>
                                        <template lwc:if={detail.isLive}>
                                            <lightning-button
                                                label="Deactivate"
                                                data-id="deactivate"
                                                disabled={busy}
                                                onclick={handleDeactivate}
                                                class="slds-m-right_x-small"
                                            ></lightning-button>
                                            <lightning-button
                                                variant="destructive-text"
                                                label="Kill switch"
                                                data-id="kill"
                                                disabled={busy}
                                                onclick={handleEngageKill}
                                            ></lightning-button>
                                        </template>
                                        <template lwc:if={detail.isKilled}>
                                            <lightning-button
                                                variant="brand"
                                                label="Release kill switch"
                                                data-id="release-kill"
                                                disabled={busy}
                                                onclick={handleReleaseKill}
                                            ></lightning-button>
                                        </template>
                                        </div>
                                        <lightning-button
                                            variant="destructive-text"
                                            label="Delete card"
                                            data-id="delete-card"
                                            disabled={busy}
                                            onclick={handleRequestDeleteCard}
                                        ></lightning-button>
                                    </div>

                                    <div
                                        class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-top_small"
                                        role="status"
                                        data-id="delete-note"
                                    >
                                        <div class="slds-media__figure">
                                            <lightning-icon
                                                icon-name="utility:warning"
                                                size="x-small"
                                                variant="warning"
                                            ></lightning-icon>
                                        </div>
                                        <div class="slds-media__body">
                                            <p>
                                                Deleting a card takes its visibility rules with it, and
                                                cannot be undone.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template lwc:else>
                        <c-empty-state
                            data-id="no-card"
                            title="No card open"
                            illustration-name="noresults:unknown"
                            alternative-text="No results illustration"
                            description="Pick a card from the list to edit its tile, its rules, and its release state."
                        ></c-empty-state>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- Creation and confirmation surfaces. They sit outside every state
         branch so the empty-org state can reach New tab too. -->
    <template lwc:if={newCardOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="nc-title" class="slds-modal slds-fade-in-open" data-id="new-card-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="nc-title" class="slds-modal__title">New card</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Developer name" required data-id="nc-devname" field-level-help="Stable unique name; the catalog references it."></lightning-input>
                    <lightning-input label="Label" required data-id="nc-label"></lightning-input>
                    <lightning-textarea label="Description" max-length="1000" data-id="nc-description"></lightning-textarea>
                    <div class="slds-form-element slds-m-top_x-small">
                        <span class="slds-form-element__label">Icon</span>
                        <div class="slds-form-element__control">
                            <button
                                type="button"
                                class="slds-button slds-button_neutral v360-builder-icon-trigger"
                                title={newCardIconLabel}
                                data-id="nc-icon"
                                data-target="newCard"
                                onclick={handleOpenIconPicker}
                            >
                                <lightning-icon
                                    icon-name={newCardIconPreview}
                                    size="x-small"
                                    class="slds-m-right_x-small slds-shrink-none"
                                ></lightning-icon>
                                <span class="slds-truncate v360-builder-icon-value">{newCardIconLabel}</span>
                            </button>
                        </div>
                    </div>
                    <lightning-input label="Tile button label" placeholder="Consultar" data-id="nc-button-label"></lightning-input>
                    <lightning-combobox label="Renders" value={newCardType} options={newCardTypeOptions} data-id="nc-type" onchange={handleNewCardTypeChange}></lightning-combobox>
                    <template lwc:if={isNewCardFlow}>
                        <lightning-combobox label="Component" required options={componentOptions} data-id="nc-component" field-level-help="Only registry names, so a saved binding always resolves."></lightning-combobox>
                    </template>
                    <template lwc:else>
                        <lightning-input label="Flow API name" required data-id="nc-flow" field-level-help="Validated as an active screen flow on save."></lightning-input>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="nc-cancel" onclick={handleCloseModals}></lightning-button>
                    <lightning-button variant="brand" label="Create draft" class="slds-m-left_x-small" data-id="nc-save" disabled={busy} onclick={handleCreateCard}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={newRuleOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="nr-title" class="slds-modal slds-fade-in-open" data-id="new-rule-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="nr-title" class="slds-modal__title">Add visibility rule</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Developer name" required data-id="nr-devname"></lightning-input>
                    <lightning-textarea label="Visibility formula" class="v360-builder-formula" data-id="nr-formula" field-level-help="Leave it blank to add the rule now and write the formula next."></lightning-textarea>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="nr-cancel" onclick={handleCloseModals}></lightning-button>
                    <lightning-button variant="brand" label="Create rule" class="slds-m-left_x-small" data-id="nr-save" disabled={busy} onclick={handleCreateRule}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={tabModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="nt-title" class="slds-modal slds-fade-in-open" data-id="tab-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="nt-title" class="slds-modal__title">{tabModalTitle}</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium v360-modal-content_overflowing">
                    <lightning-input label="Developer name" required value={tabForm.developerName} disabled={isEditingTab} data-id="nt-devname" field-level-help="Locked after creation. Record pages reference it by name through the shell's tabApiName, and configuration is upserted between orgs on it, so renaming would break the page and duplicate the tab."></lightning-input>
                    <!-- The object is a closed list this org already knows, so it is
                         picked rather than typed. The free-text box this replaces
                         made every typo something the server had to catch on save. -->
                    <c-v360-object-picker
                        label="Anchor object"
                        required
                        placeholder="Search objects"
                        value={tabForm.sObjectApiName}
                        data-id="nt-anchor"
                        field-level-help="The object whose record pages host this tab. Search by label or API name; the API name is what gets stored."
                    ></c-v360-object-picker>
                    <template lwc:if={isEditingTab}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                            Placement is not configured here: the shell takes one tab per FlexiPage
                            component, so where it appears is decided in Lightning App Builder.
                        </p>
                    </template>
                </div>
                <div class="slds-modal__footer slds-grid">
                    <template lwc:if={isEditingTab}>
                        <lightning-button variant="destructive-text" label="Delete tab" data-id="nt-delete" disabled={busy} onclick={handleRequestDeleteTab}></lightning-button>
                    </template>
                    <div class="slds-col_bump-left">
                        <lightning-button label="Cancel" data-id="nt-cancel" onclick={handleCloseModals}></lightning-button>
                        <lightning-button variant="brand" label="Save tab" class="slds-m-left_x-small" data-id="nt-save" disabled={busy} onclick={handleSaveTab}></lightning-button>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <!-- The preview mounts the shell itself rather than redrawing what it would
         look like. A copy of the gallery would drift from the real one and
         would answer only "does this read right"; the shell answers "does this
         work" -- a card bound to a component the registry does not carry, or one
         that fails on mount, shows up here instead of on a record page.

         Which means it needs a record: the shell reads one, and the visibility
         engine decides against it. So the record is asked for first, and nothing
         renders until there is one. -->
    <template lwc:if={previewOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="pv-title"
            class="slds-modal slds-modal_large slds-fade-in-open"
            data-id="preview-modal"
        >
            <div class="slds-modal__container">
                <!-- Both the notice and the record picker sit in the header, out
                     of the scrolling content: the picker opens a dropdown that
                     the content would clip, and the notice has to stay readable
                     however far down the preview is scrolled. -->
                <div class="slds-modal__header">
                    <h2 id="pv-title" class="slds-modal__title">Preview {documentName}</h2>
                    <p
                        class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                        data-id="preview-notice"
                    >
                        This runs the real visibility rules, for you. Cards a rule keeps from
                        you are missing here too, so this is your view of the tab and not
                        everyone's.
                    </p>
                    <div class="slds-m-top_small v360-builder-preview-picker">
                        <lightning-record-picker
                            label="Preview on record"
                            placeholder="Search records"
                            object-api-name={anchorSObject}
                            data-id="preview-record"
                            onchange={handlePreviewRecordChange}
                        ></lightning-record-picker>
                    </div>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={previewRecordId}>
                        <c-v360-shell
                            data-id="preview-shell"
                            record-id={previewRecordId}
                            tab-api-name={previewTabApiName}
                        ></c-v360-shell>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_regular slds-text-color_weak slds-text-align_center slds-p-vertical_large">
                            Choose a {anchorSObject} record to preview this tab on.
                        </p>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        data-id="preview-close"
                        onclick={handleClosePreview}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={helpOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="help-title" class="slds-modal slds-modal_medium slds-fade-in-open" data-id="help-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="help-title" class="slds-modal__title">How Vista 360 configuration works</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <ul class="slds-list_dotted">
                        <li class="slds-m-bottom_x-small">
                            <strong>Tabs</strong> are surfaces anchored to one object. A record page reaches a tab
                            by its developer name, so that name is locked once created — renaming it would leave
                            the page pointing at nothing, and the deployment that did it would still report
                            success.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Cards</strong> bind to a registered Lightning component or an active screen
                            flow. The picker only offers registered components, so a saved binding always
                            resolves.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Drafts</strong> are invisible to end users, whatever their rules say. Work a
                            card out fully, then activate it from Release.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Visibility rules</strong> decide who sees a live card. Each rule is one
                            <em>way to qualify</em>, so a user passing any single <em>active</em> rule sees the
                            card. Within one rule the opposite holds: its formula and every required access it
                            lists must all hold together. Two audiences, two rules — that is how a card reaches
                            collections <em>or</em> risk, which no single formula can express because a Permission
                            Set is not readable from one.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            A rule switched <strong>Off</strong> is skipped entirely — not a path that failed, but
                            one that is not there. A card whose rules are all Off is as open as one with no rules
                            at all, which is why this console counts active rules and not stored ones.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Formulas</strong> read fields of the anchor object plus four identity globals:
                            <code>$Permission</code> (a Custom Permission), <code>$Profile</code>,
                            <code>$User</code> and <code>$UserRole</code>. Compare picklists with
                            <code>ISPICKVAL()</code>, not <code>=</code>. 3,900 characters maximum. Check the
                            syntax before saving — the engine is the authority, not the pickers.
                        </li>
                        <li class="slds-m-bottom_x-small">
                            <strong>Required access</strong> is what a formula cannot express. Permission set
                            membership is not readable from a formula at all, so it is a predicate here, enforced
                            on top of the formula and never instead of it. Field read access works the same way.
                        </li>
                        <li>
                            <strong>Kill switch</strong> hides a card everywhere at once without evaluating a
                            single rule. It is the incident control; deactivating is the ordinary one.
                        </li>
                    </ul>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        variant="brand"
                        label="Got it"
                        data-id="help-close"
                        onclick={handleCloseModals}
                    ></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>

    <template lwc:if={iconPickerOpen}>
        <c-v360-icon-picker
            selected-icon={selectedIconForPicker}
            onselect={handleIconSelect}
            onclose={handleCloseIconPicker}
        ></c-v360-icon-picker>
    </template>

    <template lwc:if={deleteTarget}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="del-title" class="slds-modal slds-fade-in-open" data-id="delete-modal">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="del-title" class="slds-modal__title">Confirm deletion</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{deleteMessage}</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" data-id="del-cancel" onclick={handleCloseModals}></lightning-button>
                    <lightning-button variant="destructive" label="Delete" class="slds-m-left_x-small" data-id="del-confirm" disabled={busy} onclick={handleConfirmDelete}></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
