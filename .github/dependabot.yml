version: 2
updates:
  # Keep the SHA-pinned third-party GitHub Actions current. Dependabot opens a
  # PR (bumping the pinned commit SHA + version comment) so upgrades are
  # reviewable and auditable rather than floating on a mutable tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
