name: Deploy to PRODUCTION
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli
          sf plugins install sfdx-hardis --no-prompt && sf plugins install sfdx-git-delta --no-prompt
      - name: JWT auth to PROD org
        run: sf hardis auth login
      - name: Delta deploy + RunLocalTests
        run: sf hardis project deploy smart --test-level RunLocalTests
      - name: Inject Named Credential secret
        env:
          SECRET: ${{ secrets.TEST_HTTPBIN_SECRET }}
        run: |
          sed "s|__SECRET__|$SECRET|" scripts/inject-named-credentials.json > /tmp/cred.json
          sf api request rest "/services/data/v62.0/named-credentials/credential" \
            --method POST --body /tmp/cred.json
