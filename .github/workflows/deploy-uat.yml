name: Deploy to UAT
on:
  push:
    branches: [uat]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-hardis && echo y | sf plugins install sfdx-git-delta
      - name: JWT auth to UAT org
        run: sf hardis auth login
      - name: Delta deploy (Quick Deploy)
        run: sf hardis project deploy smart
      - name: Inject Named Credential secret
        env:
          SECRET: ${{ secrets.TEST_HTTPBIN_SECRET }}
        run: |
          sed "s|__SECRET__|$SECRET|" scripts/inject-named-credentials.json > /tmp/cred.json
          sf api request rest "/services/data/v62.0/named-credentials/credential" \
            --method POST --body /tmp/cred.json
