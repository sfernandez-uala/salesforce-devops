name: Deploy to DEV
on:
  push:
    branches: [dev]

# Serialize deploys to the same environment so two pushes can never
# interleave a half-applied metadata deploy. Never cancel an in-flight
# deploy — queue the next one instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-hardis
          echo y | sf plugins install sfdx-git-delta
      - name: Login & Deploy
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis project deploy smart
      - name: Inject Named Credential secret
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          SECRET: ${{ secrets.TEST_HTTPBIN_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "TEST_HTTPBIN_SECRET not configured, skipping credential injection"
            exit 0
          fi
          sed "s|__SECRET__|$SECRET|" scripts/inject-named-credentials.json > /tmp/cred.json
          sf api request rest "/services/data/v67.0/named-credentials/credential" \
            --method POST --body "$(cat /tmp/cred.json)"
      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-dev-${{ github.sha }}
          path: hardis-report/
          if-no-files-found: ignore
          retention-days: 90
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping failure notification"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Deploy to DEV FAILED — ${{ github.repository }}@${{ github.sha }} — $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
