name: Deploy to DEV
on:
  push:
    branches: [dev]

# Serialize deploys to the same environment so two pushes can never
# interleave a half-applied metadata deploy. Never cancel an in-flight
# deploy — queue the next one instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
          echo y | sf plugins install sfdx-git-delta@6.45.1
      - name: Login & Deploy
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          # SFDX_CLIENT_KEY_DEV holds the raw PEM key; hardis reads SFDX_CLIENT_CERT_DEV
          # as the key content and uses raw PEM directly (no decryption).
          SFDX_CLIENT_CERT_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis project deploy smart
      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-report-dev-${{ github.sha }}
          path: hardis-report/
          if-no-files-found: ignore
          retention-days: 90
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping failure notification"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Deploy to DEV FAILED — ${{ github.repository }}@${{ github.sha }} — $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
