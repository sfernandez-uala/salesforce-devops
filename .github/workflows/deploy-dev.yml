name: Deploy to DEV
on:
  push:
    branches: [dev]

# Serialize deploys to the same environment so two pushes can never
# interleave a half-applied metadata deploy. Never cancel an in-flight
# deploy — queue the next one instead.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
          echo y | sf plugins install sfdx-git-delta@6.45.1
      - name: Login & Deploy
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis project deploy smart
      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-report-dev-${{ github.sha }}
          path: hardis-report/
          if-no-files-found: ignore
          retention-days: 90
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping failure notification"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Deploy to DEV FAILED — ${{ github.repository }}@${{ github.sha }} — $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
