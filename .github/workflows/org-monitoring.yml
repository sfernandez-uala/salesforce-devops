name: Org Monitoring
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent an overlapping scheduled + manual run from racing the same backup.
concurrency:
  group: org-monitoring
  cancel-in-progress: false

jobs:
  backup-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-hardis
      - name: Login & backup
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis org monitor backup

  backup-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-hardis
      - name: Login & backup
        env:
          SFDX_CLIENT_ID_MAIN:  ${{ secrets.SFDX_CLIENT_ID_MAIN }}
          SFDX_CLIENT_KEY_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis org monitor backup
