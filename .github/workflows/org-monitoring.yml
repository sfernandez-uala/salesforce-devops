name: Org Monitoring
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent an overlapping scheduled + manual run from racing the same backup.
concurrency:
  group: org-monitoring
  cancel-in-progress: false

jobs:
  backup-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
      - name: Login & backup
        env:
          SFDX_CLIENT_ID_DEV:  ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV: ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          # Scheduled/dispatch runs check out the default branch (main), so hardis
          # would otherwise derive the org from "main" and demand SFDX_CLIENT_ID_MAIN.
          # Pin the branch context so auth + backup target the DEV org.
          CI_COMMIT_REF_NAME:  dev
          CONFIG_BRANCH:       dev
          ORG_ALIAS:           dev
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis org monitor backup

  backup-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
      - name: Login & backup
        env:
          SFDX_CLIENT_ID_UAT:  ${{ secrets.SFDX_CLIENT_ID_UAT }}
          SFDX_CLIENT_KEY_UAT: ${{ secrets.SFDX_CLIENT_KEY_UAT }}
          # Scheduled/dispatch runs check out the default branch (main), so hardis
          # would otherwise derive the org from "main" and demand SFDX_CLIENT_ID_MAIN.
          # Pin the branch context so auth + backup target the UAT org.
          CI_COMMIT_REF_NAME:  uat
          CONFIG_BRANCH:       uat
          ORG_ALIAS:           uat
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis org monitor backup

  backup-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
      - name: Login & backup
        env:
          SFDX_CLIENT_ID_MAIN:  ${{ secrets.SFDX_CLIENT_ID_MAIN }}
          SFDX_CLIENT_KEY_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          # Pin the branch context so auth + backup target the PROD org explicitly
          # (rather than relying on the checked-out default branch).
          CI_COMMIT_REF_NAME:   main
          CONFIG_BRANCH:        main
          ORG_ALIAS:            main
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis org monitor backup
