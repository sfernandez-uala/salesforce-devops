name: PR Quality Gate
on:
  pull_request:
    branches: [dev, uat, main]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install CLI + Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install @salesforce/plugin-code-analyzer@5.14.0
      - name: PMD on delta files only
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMRT \
            origin/${{ github.base_ref }}...HEAD \
            | grep -E '^force-app/.*\.(cls|trigger|page)$' | paste -sd, -)
          if [ -n "$CHANGED" ]; then
            sf code-analyzer run --workspace "$CHANGED" \
              --rule-selector pmd --severity-threshold 3 \
              --output-file results.sarif
            # Zero findings -> code-analyzer writes a SARIF with no results, which
            # the upload-sarif action rejects ("1 item required; only 0 supplied").
            # Drop it so the upload step's hashFiles guard skips cleanly.
            if [ "$(jq '[.runs[]?.results[]?] | length' results.sarif 2>/dev/null || echo 0)" -eq 0 ]; then
              rm -f results.sarif
            fi
          fi
      # Publish findings to the Security -> Code scanning tab: persistent history
      # + audit trail of accepted/dismissed findings + inline PR annotations.
      # Runs even when the gate fails so red-gate findings are still recorded.
      - name: Upload PMD findings to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
          category: pmd-delta

  delta-check-deploy:
    runs-on: ubuntu-latest
    name: Simulate Deployment to Target Org
    # Bind to the GitHub Environment of the target branch so the gate reads that
    # environment's JWT secrets (single source of truth — no repo-level duplication).
    # Branch name matches the environment except main, which maps to "prod".
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || github.event.pull_request.base.ref }}
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
          echo y | sf plugins install sfdx-git-delta@6.45.1
      - name: Login & Simulate deployment
        env:
          SFDX_CLIENT_ID_DEV:   ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV:  ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          SFDX_CLIENT_ID_UAT:   ${{ secrets.SFDX_CLIENT_ID_UAT }}
          SFDX_CLIENT_KEY_UAT:  ${{ secrets.SFDX_CLIENT_KEY_UAT }}
          SFDX_CLIENT_ID_MAIN:  ${{ secrets.SFDX_CLIENT_ID_MAIN }}
          SFDX_CLIENT_KEY_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          # The SFDX_CLIENT_KEY_* secrets hold the raw PEM private key (server.key).
          # hardis reads SFDX_CLIENT_CERT_<ORG> as the key content and, on detecting a
          # raw PEM header, uses it directly with NO decryption — the supported path
          # when the External Client App / certificate is created manually.
          SFDX_CLIENT_CERT_DEV:  ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          SFDX_CLIENT_CERT_UAT:  ${{ secrets.SFDX_CLIENT_KEY_UAT }}
          SFDX_CLIENT_CERT_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          CI_COMMIT_REF_NAME:   ${{ github.event.pull_request.base.ref }}
          CONFIG_BRANCH:        ${{ github.event.pull_request.base.ref }}
          ORG_ALIAS:            ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          CI_SFDX_HARDIS_GITHUB_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          sf hardis auth login
          sf hardis project deploy smart --check

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scan
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Run the gitleaks BINARY (MIT, free under any owner incl. private org
      # repos) rather than gitleaks-action, which requires a paid license for
      # organization-owned repos — the target setup once this moves to Uala.
      # Version pinned for supply-chain integrity. Config: ./.gitleaks.toml
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "/tmp/$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$TARBALL"
          echo "$GITLEAKS_SHA256  /tmp/$TARBALL" | sha256sum -c -
          tar -xz -C /tmp -f "/tmp/$TARBALL" gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        run: gitleaks git . --redact --verbose --no-banner

  deletion-check:
    runs-on: ubuntu-latest
    name: Undeclared Deletion Check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install CLI + git-delta
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-git-delta@6.45.1
      # Full-deploy model: a metadata file removed from source is NOT deleted
      # from the org unless it is explicitly listed in manifest/destructiveChanges.xml.
      # sfdx-git-delta computes what git says was deleted; fail the PR if any of
      # those deletions is not declared, so nothing silently orphans in the org.
      - name: Detect undeclared metadata deletions
        run: |
          set -euo pipefail
          # sgd requires the output dir to already exist; a genuine sgd failure
          # must fail this job (no `|| true` masking) so the detector can't pass
          # blindly.
          mkdir -p sgd-out
          sf sgd source delta \
            --from "origin/${{ github.base_ref }}" --to HEAD \
            --output-dir sgd-out
          SGD_DESTR="sgd-out/destructiveChanges/destructiveChanges.xml"
          if [ ! -f "$SGD_DESTR" ]; then
            echo "git-delta produced no destructive manifest; nothing to check."
            exit 0
          fi
          grep -oE '<members>[^<]+</members>' "$SGD_DESTR" | sort -u > git_deletions.txt || true
          if [ ! -s git_deletions.txt ]; then
            echo "No git-derived metadata deletions in this PR."
            exit 0
          fi
          if [ -f manifest/destructiveChanges.xml ]; then
            grep -oE '<members>[^<]+</members>' manifest/destructiveChanges.xml | sort -u > declared.txt || true
          else
            : > declared.txt
          fi
          UNDECLARED=$(comm -23 git_deletions.txt declared.txt || true)
          if [ -n "$UNDECLARED" ]; then
            echo "::error::Metadata was removed from source but is NOT declared in manifest/destructiveChanges.xml."
            echo "Under the full-deploy model these would silently remain (orphaned) in the target org:"
            echo "$UNDECLARED" | sed 's/<[^>]*>//g'
            echo "Fix: add them to manifest/destructiveChanges.xml to delete them from the org, or restore the files."
            exit 1
          fi
          echo "All git-derived deletions are declared in manifest/destructiveChanges.xml. OK."

  apex-test-report:
    runs-on: ubuntu-latest
    name: Apex Test Results
    # Same environment binding as the gate so it JWT-auths to the target org.
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || github.event.pull_request.base.ref }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install CLI + plugins
        run: |
          npm install --global @salesforce/cli@2.142.7
          echo y | sf plugins install sfdx-hardis@7.20.0
      # Smart selection: run only the tests that cover the changed Apex classes
      # (the changed class itself if it is @isTest, plus any @isTest class that
      # references it), so a PR never triggers the whole org's test suite.
      - name: Detect relevant test classes
        id: tests
        run: |
          DIR="force-app/main/default/classes"
          CHANGED=$(git diff --name-only --diff-filter=ACMRT \
            "origin/${{ github.base_ref }}...HEAD" \
            | grep -E "^${DIR}/.*\.cls$" || true)
          SET=""
          for f in $CHANGED; do
            name=$(basename "$f" .cls)
            # The changed class is itself a test class -> run it directly.
            if [ -f "$f" ] && grep -qi '@istest' "$f"; then
              SET="${SET}${name}"$'\n'
            fi
            # Any test class that references the changed class -> run it too.
            for ref in $(grep -rlw --include='*.cls' "$name" "$DIR" 2>/dev/null || true); do
              if grep -qi '@istest' "$ref"; then
                SET="${SET}$(basename "$ref" .cls)"$'\n'
              fi
            done
          done
          LIST=$(printf '%s' "$SET" | grep -v '^$' | sort -u | paste -sd, -)
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Relevant test classes: ${LIST:-<none>}"
      - name: Run tests & post coverage comment
        if: steps.tests.outputs.list != ''
        env:
          SFDX_CLIENT_ID_DEV:   ${{ secrets.SFDX_CLIENT_ID_DEV }}
          SFDX_CLIENT_KEY_DEV:  ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          SFDX_CLIENT_ID_UAT:   ${{ secrets.SFDX_CLIENT_ID_UAT }}
          SFDX_CLIENT_KEY_UAT:  ${{ secrets.SFDX_CLIENT_KEY_UAT }}
          SFDX_CLIENT_ID_MAIN:  ${{ secrets.SFDX_CLIENT_ID_MAIN }}
          SFDX_CLIENT_KEY_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          # Raw-PEM path: hardis reads SFDX_CLIENT_CERT_<ORG> and uses it directly
          # (no decryption) when it detects a PEM header. See delta-check-deploy.
          SFDX_CLIENT_CERT_DEV:  ${{ secrets.SFDX_CLIENT_KEY_DEV }}
          SFDX_CLIENT_CERT_UAT:  ${{ secrets.SFDX_CLIENT_KEY_UAT }}
          SFDX_CLIENT_CERT_MAIN: ${{ secrets.SFDX_CLIENT_KEY_MAIN }}
          CI_COMMIT_REF_NAME:   ${{ github.event.pull_request.base.ref }}
          CONFIG_BRANCH:        ${{ github.event.pull_request.base.ref }}
          ORG_ALIAS:            ${{ github.event.pull_request.base.ref }}
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "1"
        run: |
          set -o pipefail
          sf hardis auth login
          IFS=',' read -ra NAMES <<< "${{ steps.tests.outputs.list }}"
          ARGS=(); for n in "${NAMES[@]}"; do ARGS+=(--tests "$n"); done
          # Informational report only: never blocks the PR. The authoritative
          # test gate is delta-check-deploy (RunLocalTests on uat/main). "|| true"
          # so a failing/absent test still posts a comment instead of erroring.
          sf apex run test "${ARGS[@]}" --code-coverage --result-format human \
            --output-dir test-results --wait 20 --target-org "$ORG_ALIAS" || true
          RESULT_FILE=$(find test-results -name 'test-result*.txt' 2>/dev/null | head -1)
          {
            echo "## Apex Test Results"
            echo ""
            echo "Ran the tests covering the changed Apex classes: \`${{ steps.tests.outputs.list }}\`"
            echo ""
            if [ -n "$RESULT_FILE" ] && [ -f "$RESULT_FILE" ]; then
              echo '```'
              cat "$RESULT_FILE"
              echo '```'
            else
              echo "_No test result produced — the selected tests may not be deployed to the target org yet (they deploy when this PR merges)._"
            fi
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
